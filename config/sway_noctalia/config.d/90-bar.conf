# Empty override to disable Fedora's default bar (waybar).
# Noctalia v5 provides its own bar/panels. Copy or symlink this file to
# ~/.config/sway/config.d/90-bar.conf to suppress /usr/share/sway/config.d/90-bar.conf
# which by default does: bar { swaybar_command waybar }
#
# Alternative is to run: echo -n > ~/.config/sway/config.d/90-bar.conf
